name: Android build comparison pair

on:
  workflow_call:
    inputs:
      pair:
        required: true
        type: number

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  PRODUCTION_SHA: 6df59b5d5fe4576551ae271c7a1316830467219b

jobs:
  build:
    name: Pair ${{ inputs.pair }} (all then store)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout exact diagnostic source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Verify diagnostic source and fetch production comparison base
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          [[ "$PRODUCTION_SHA" =~ ^[a-f0-9]{40}$ ]]
          git fetch --no-tags --depth=1 origin "$PRODUCTION_SHA"

      - name: Setup Node environment
        uses: ./.github/actions/setup-node-env
        with:
          cache-mode: off
          install-bun: "true"
          node-version: "24.22.1"

      - name: Setup Android toolchain
        uses: ./.github/actions/setup-android-toolchain
        with:
          cache-mode: off
          install-screenshot-emulators: "false"

      - name: Baseline - build all synthetic signed artifacts
        shell: bash
        env:
          COMPARISON_ARTIFACT: all
          COMPARISON_PAIR: ${{ inputs.pair }}
          PROOF_DIR: ${{ runner.temp }}/android-build-comparison/all
          GRADLE_USER_HOME: ${{ runner.temp }}/android-build-comparison-gradle/all
        run: python3 scripts/android-store-bundles-comparison.py

      - name: Candidate - build store synthetic signed artifacts
        shell: bash
        env:
          COMPARISON_ARTIFACT: store
          COMPARISON_PAIR: ${{ inputs.pair }}
          PROOF_DIR: ${{ runner.temp }}/android-build-comparison/store
          GRADLE_USER_HOME: ${{ runner.temp }}/android-build-comparison-gradle/store
        run: python3 scripts/android-store-bundles-comparison.py

      - name: Retain build-only comparison evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-build-comparison-pair-${{ inputs.pair }}
          path: ${{ runner.temp }}/android-build-comparison
          if-no-files-found: error
          retention-days: 14
