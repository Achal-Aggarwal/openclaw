name: Compiler cache qualification
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: compiler-cache-qualification-${{ github.ref }}
  cancel-in-progress: false
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  OPENCLAW_LOCAL_CHECK: "0"
  OPENCLAW_TSGO_TIMEOUT_MS: "480000"
jobs:
  seed:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Preserve committed benchmark
        run: cp .github/compiler-cache-benchmark.py "$RUNNER_TEMP/compiler-cache-benchmark.py"
      - name: Select frozen workload
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: adc889d4215877915268f291c3d4897e2a815844
          persist-credentials: false
      - uses: ./.github/actions/setup-node-env
        with:
          semantic-checks: "true"
          install-bun: "false"
          cache-mode: restore
      - name: Build immutable baseline caches
        run: python3 "$RUNNER_TEMP/compiler-cache-benchmark.py" seed
      - name: Transfer baseline caches
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: compiler-cache-seed
          path: ${{ runner.temp }}/compiler-cache-seed
          compression-level: 0
          retention-days: 3
          if-no-files-found: error
      - name: Upload seed evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: compiler-cache-seed-evidence
          path: ${{ runner.temp }}/compiler-cache-benchmark
          retention-days: 3
          if-no-files-found: warn
  compare:
    needs: seed
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Preserve committed benchmark
        run: cp .github/compiler-cache-benchmark.py "$RUNNER_TEMP/compiler-cache-benchmark.py"
      - name: Select frozen workload
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: adc889d4215877915268f291c3d4897e2a815844
          persist-credentials: false
      - uses: ./.github/actions/setup-node-env
        with:
          semantic-checks: "true"
          install-bun: "false"
          cache-mode: restore
      - name: Start transfer measurement
        run: python3 -c 'import os,time,pathlib; (pathlib.Path(os.environ["RUNNER_TEMP"])/"compiler-cache-transfer-start").write_text(str(time.time()))'
      - name: Download immutable baseline caches
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: compiler-cache-seed
          path: ${{ runner.temp }}/compiler-cache-seed
      - name: Compare five cold and restored pairs per workload
        run: python3 "$RUNNER_TEMP/compiler-cache-benchmark.py" compare
      - name: Upload comparison evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: compiler-cache-comparison
          path: ${{ runner.temp }}/compiler-cache-benchmark
          retention-days: 3
          if-no-files-found: error
