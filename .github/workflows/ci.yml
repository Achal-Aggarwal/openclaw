name: Compiler qualification
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: compiler-qualification-${{ github.ref }}
  cancel-in-progress: false
jobs:
  compare:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
      OPENCLAW_LOCAL_CHECK: "0"
      OPENCLAW_TSGO_TIMEOUT_MS: "360000"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Preserve qualification harness
        shell: bash
        run: cp .github/compiler-qualification.py "$RUNNER_TEMP/compiler-qualification.py"
      - name: Select frozen workload
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: b4bce788b95ae7c2eb568b9712d91c0219083707
          persist-credentials: false
      - uses: ./.github/actions/setup-node-env
        with:
          semantic-checks: "true"
          install-bun: "false"
          cache-mode: restore
      - name: Compare pinned compilers
        shell: bash
        run: python3 "$RUNNER_TEMP/compiler-qualification.py"
      - name: Upload qualification evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: compiler-qualification
          path: ${{ runner.temp }}/compiler-qualification
          retention-days: 3
          if-no-files-found: error
