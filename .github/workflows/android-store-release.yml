name: Android Store Release

run-name: Android ${{ github.event_name == 'schedule' && github.event.schedule == '0 11 * * 1' && 'Store release (weekly)' || (((github.event_name == 'schedule' && github.event.schedule == '0 7 * * *') || inputs.operation == 'internal') && 'Internal testing distribution' || 'Store release') }}

on:
  schedule:
    - cron: "0 7 * * *"
      timezone: America/Los_Angeles
    - cron: "0 11 * * 1"
      timezone: America/Los_Angeles
  workflow_dispatch:
    inputs:
      operation:
        description: Stage a Google Play release or distribute an Internal testing build
        required: true
        default: release
        type: choice
        options:
          - release
          - internal

permissions: {}

concurrency:
  group: android-checkout-proof-${{ github.run_id }}
  cancel-in-progress: false
  queue: max

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  NODE_VERSION: "24.22.1"

jobs:
  qualify:
    if: >-
      github.ref == 'refs/heads/main' && github.repository == 'openclaw/openclaw' &&
      ((github.event_name == 'schedule' && github.event.schedule == '0 11 * * 1') ||
      (github.event_name == 'workflow_dispatch' && inputs.operation == 'release'))
    permissions:
      actions: read
      contents: read
    uses: ./.github/workflows/android-release-e2e.yml
    with:
      target_sha: ${{ github.sha }}

  release:
    name: Prepare and upload Android release
    needs: qualify
    if: >-
      !cancelled() &&
      github.ref == 'refs/heads/main' && github.repository == 'openclaw/openclaw' &&
      ((github.event_name == 'schedule' && github.event.schedule == '0 7 * * *' && vars.ANDROID_INTERNAL_ENABLED == 'true') ||
      (github.event_name == 'workflow_dispatch' && inputs.operation == 'internal') ||
      (needs.qualify.result == 'success' &&
      ((github.event_name == 'schedule' && github.event.schedule == '0 11 * * 1') ||
      (github.event_name == 'workflow_dispatch' && inputs.operation == 'release'))))
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    environment: ${{ ((github.event_name == 'schedule' && github.event.schedule == '0 7 * * *') || inputs.operation == 'internal') && 'android-internal' || 'android-store-release' }}
    steps:
      - name: Checkout release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Verify release source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Fetch release source history
        shell: bash
        run: |
          set -euo pipefail
          # Keep release-note history without fetching unrelated branches and tags.
          git fetch --no-tags --unshallow origin "+$GITHUB_SHA:refs/remotes/origin/main"

      - name: Prepare trusted Linux Android tooling
        if: >-
          (github.event_name == 'schedule' && github.event.schedule == '0 11 * * 1') ||
          (github.event_name == 'workflow_dispatch' && inputs.operation == 'release')
        shell: bash
        run: |
          set -euo pipefail
          test "$RUNNER_OS/$RUNNER_ARCH" = "Linux/X64"
          for executable in /usr/bin/apt-get /usr/bin/sudo /usr/bin/timeout; do
            test -x "$executable"
          done
          apt_source="/etc/apt/sources.list.d/ubuntu.sources"
          apt_source_parts="$RUNNER_TEMP/openclaw-android-apt-sourceparts-disabled"
          test -s "$apt_source"
          if [[ -e "$apt_source_parts" || -L "$apt_source_parts" ]]; then
            echo "::error::Task-private APT source-parts path must remain absent"
            exit 1
          fi
          apt_options=(
            -o "Dir::Etc::sourcelist=$apt_source"
            -o "Dir::Etc::sourceparts=$apt_source_parts"
          )
          /usr/bin/timeout --signal=TERM --kill-after=10s 300s \
            /usr/bin/sudo env DEBIAN_FRONTEND=noninteractive \
            /usr/bin/apt-get "${apt_options[@]}" update
          /usr/bin/timeout --signal=TERM --kill-after=10s 300s \
            /usr/bin/sudo env DEBIAN_FRONTEND=noninteractive \
            /usr/bin/apt-get "${apt_options[@]}" install \
            -y --no-install-recommends imagemagick
          test -x /usr/bin/convert
          test -x /usr/bin/identify

          tool_dir="$RUNNER_TEMP/openclaw-android-tools"
          mkdir -p "$tool_dir"
          install -m 700 scripts/android-sips-linux.sh "$tool_dir/android-sips-linux.sh"

      - name: Setup Node environment
        uses: ./.github/actions/setup-node-env
        with:
          cache-mode: off
          install-bun: "true"
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup Android toolchain
        uses: ./.github/actions/setup-android-toolchain
        with:
          cache-mode: off
          install-screenshot-emulators: ${{ ((github.event_name == 'schedule' && github.event.schedule == '0 11 * * 1') || (github.event_name == 'workflow_dispatch' && inputs.operation == 'release')) && 'true' || 'false' }}

      - name: Setup Ruby
        uses: ruby/setup-ruby@824c0e29fdfc7d689c191c27acc969d2d04b7dd8 # v1.331.0
        with:
          ruby-version: "4.0.7"
          bundler: "4.0.23"
          bundler-cache: false
          working-directory: apps/android

      - name: Install locked Fastlane bundle
        working-directory: apps/android
        run: |
          set -euo pipefail
          bundle _4.0.23_ install --jobs 4 --retry 3
          bundle _4.0.23_ check
          test "$(bundle _4.0.23_ exec ruby -e 'require "fastlane"; print Fastlane::VERSION')" = "2.241.1"

      - name: Create apps-signing read token
        id: apps-signing-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: "2729701"
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}
          owner: openclaw
          repositories: apps-signing
          permission-contents: read

      - name: Checkout encrypted Android signing assets
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: openclaw/apps-signing
          ref: main
          path: apps/android/build/release-signing/apps-signing
          token: ${{ steps.apps-signing-token.outputs.token }}
          persist-credentials: false

      - name: Materialize Android release signing
        env:
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
        run: node scripts/android-release-signing.mjs --mode materialize

      - name: Prepare and upload Android release
        env:
          GH_TOKEN: ${{ github.token }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANDROID_RELEASE_DESTINATION: ${{ ((github.event_name == 'schedule' && github.event.schedule == '0 7 * * *') || inputs.operation == 'internal') && 'internal' || 'play-store' }}
          GOOGLE_PLAY_JSON_KEY_DATA: ${{ secrets.GOOGLE_PLAY_JSON_KEY_DATA }}
          FIREBASE_APP_DISTRIBUTION_JSON_KEY_DATA: ${{ secrets.FIREBASE_APP_DISTRIBUTION_JSON_KEY_DATA }}
          FIREBASE_APP_ID: "1:627614795142:android:3daa833ca787ca67959807"
          FIREBASE_TESTER_GROUPS: android-daily
          GOOGLE_PLAY_PACKAGE_NAME: ai.openclaw.app
          GOOGLE_PLAY_RELEASE_STATUS: completed
          GOOGLE_PLAY_TRACK: internal
          GOOGLE_PLAY_VALIDATE_ONLY: "0"
          ANDROID_SCREENSHOT_DIAGNOSTICS: "1"
          SIPS: ${{ runner.temp }}/openclaw-android-tools/android-sips-linux.sh
        run: |
          set -euo pipefail
          gh auth setup-git
          pnpm android:release:upload -- \
            --destination "$ANDROID_RELEASE_DESTINATION" \
            --recovery-dir "$RUNNER_TEMP/android-release-recovery"

      - name: Remove materialized signing files
        if: always()
        run: |
          rm -rf apps/android/build/release-signing \
            "$RUNNER_TEMP/android-release-recovery/source/apps/android/build/release-signing"

      - name: Retain release plan and notes
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-release-recovery-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/android-release-recovery/release-notes.json
            ${{ runner.temp }}/android-release-recovery/android-plan.json
            ${{ runner.temp }}/android-release-recovery/firebase-result.json
          if-no-files-found: error
          retention-days: 30

      - name: Retain screenshot diagnostics
        if: >-
          always() && ((github.event_name == 'schedule' && github.event.schedule == '0 11 * * 1') ||
          (github.event_name == 'workflow_dispatch' && inputs.operation == 'release'))
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-release-emulator-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/android-release-recovery/source/.artifacts/android-screenshots/latest/*/diagnostics/**
            ${{ runner.temp }}/android-release-recovery/source/.artifacts/android-screenshots/latest/*/emulator.log
            ${{ runner.temp }}/android-release-recovery/source/.artifacts/android-screenshots/latest/*/emulator-args.txt
            ${{ runner.temp }}/android-release-recovery/source/.artifacts/android-screenshots/latest/*/process-status.txt
            ${{ runner.temp }}/android-release-recovery/source/.artifacts/android-screenshots/latest/*/ui-dumps/openclaw-*.xml
            ${{ runner.temp }}/android-release-recovery/source/.artifacts/android-screenshots/latest/*/activity-start/openclaw-*.txt
          if-no-files-found: ignore
          retention-days: 30

      - name: Retain signed release artifacts
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-release-artifacts-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/android-release-recovery/artifacts/*.aab
            ${{ runner.temp }}/android-release-recovery/artifacts/*.apk
            ${{ runner.temp }}/android-release-recovery/artifacts/*.sha256
            ${{ runner.temp }}/android-release-recovery/source/apps/android/build/release-artifacts/*.aab
            ${{ runner.temp }}/android-release-recovery/source/apps/android/build/release-artifacts/*.apk
            ${{ runner.temp }}/android-release-recovery/source/apps/android/build/release-artifacts/*.sha256
          if-no-files-found: ignore
          compression-level: 0
          retention-days: 30

  checkout-proof:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/proof/android-release-checkout'
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      max-parallel: 1
      fail-fast: true
      matrix:
        sample: [1, 2, 3, 4, 5]
    env:
      SOURCE_SHA: 0d838ac431b57bbce984636ce4e395b4e2108e7b
      BASELINE_REF: refs/openclaw/mobile-releases/android/v2/2026.10.5/0/2/2026090492-2026090493
      BASELINE_SHA: 5460cca0d0fbc076dd8a65ca9b3eba27549edbf7
    steps:
      - name: Start cold checkout measurement
        shell: bash
        run: echo "CHECKOUT_STARTED=$(date +%s)" >> "$GITHUB_ENV"

      - name: Checkout release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 1
          persist-credentials: false

      - name: Verify release source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test "$(git rev-parse --is-shallow-repository)" = true

      - name: Fetch release source history
        shell: bash
        run: |
          set -euo pipefail
          # The diagnostic branch is unmerged; use the frozen main source, not its dispatch SHA.
          git fetch --no-tags --unshallow origin "+$SOURCE_SHA:refs/remotes/origin/main"
          echo "CHECKOUT_SECONDS=$(($(date +%s) - CHECKOUT_STARTED))" >> "$GITHUB_ENV"

      - name: Verify full selected history without unrelated refs
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test "$(git rev-parse --is-shallow-repository)" = false
          test "$(git for-each-ref --format='%(refname)' refs/remotes refs/tags)" = refs/remotes/origin/main
          test "$(git rev-parse origin/main)" = "$SOURCE_SHA"
          test "$(git rev-list --count "$SOURCE_SHA")" = 121122
          {
            echo "Sample ${{ matrix.sample }} cold checkout + source history: ${CHECKOUT_SECONDS}s"
            echo '```'
            git count-objects -v
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Verify existing main and public baseline fetches
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin refs/heads/main
          git merge-base --is-ancestor "$SOURCE_SHA" FETCH_HEAD
          echo "Main verification fetch: $(($(date +%s) - CHECKOUT_STARTED - CHECKOUT_SECONDS))s" | tee -a "$GITHUB_STEP_SUMMARY"
          test "$(git ls-remote --refs origin "$BASELINE_REF" | cut -f1)" = "$BASELINE_SHA"
          git fetch --no-tags origin "$BASELINE_REF"
          test "$(git rev-parse FETCH_HEAD)" = "$BASELINE_SHA"
          staged="$RUNNER_TEMP/staged-release"
          git worktree add --detach "$staged" "$SOURCE_SHA"
          cd "$staged"
          roots=(
            apps/android/app/src/main/ apps/android/app/src/play/
            apps/android/wear/src/main/ apps/android/wear-shared/src/main/
            apps/shared/OpenClawKit/Sources/OpenClawKit/Resources/ apps/shared/mermaid/
          )
          # Compare with the full local history at the successful release's saved source/baseline.
          diff_hash="$(git diff --no-ext-diff --no-textconv --find-renames=50% --unified=3 "$BASELINE_SHA" "$SOURCE_SHA" -- "${roots[@]}" | sha256sum | cut -d' ' -f1)"
          history_hash="$(git log --first-parent --format=%s --max-count=80 "$BASELINE_SHA..$SOURCE_SHA" -- "${roots[@]}" | sha256sum | cut -d' ' -f1)"
          test "$diff_hash" = c40c226fbf1846bae1aaaa729860f352236bc8ea671ef26258faeaf25785b290
          test "$history_hash" = f281e0046f91e0ccfaa6a7f3e4befda94f25e98822b9fbfe48ec73c08b463d48
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test -z "$(git status --porcelain)"
          echo 'Exact source, 121122 ancestors, current-main ancestry, saved public baseline, endpoint diff and first-parent history verified.' | tee -a "$GITHUB_STEP_SUMMARY"
          echo "Total source preparation: $(($(date +%s) - CHECKOUT_STARTED))s" | tee -a "$GITHUB_STEP_SUMMARY"
