name: Android Store build comparison

run-name: Android Store A/B build comparison (5 serial same-host pairs)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pair-1:
    uses: ./.github/workflows/android-build-comparison-sample.yml
    with:
      pair: 1

  pair-2:
    needs: pair-1
    uses: ./.github/workflows/android-build-comparison-sample.yml
    with:
      pair: 2

  pair-3:
    needs: pair-2
    uses: ./.github/workflows/android-build-comparison-sample.yml
    with:
      pair: 3

  pair-4:
    needs: pair-3
    uses: ./.github/workflows/android-build-comparison-sample.yml
    with:
      pair: 4

  pair-5:
    needs: pair-4
    uses: ./.github/workflows/android-build-comparison-sample.yml
    with:
      pair: 5
