name: Android Store build comparison

run-name: Android Store A/B build comparison (10 serial fresh-runner samples)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sample-1:
    uses: ./.github/workflows/android-build-comparison-sample.yml
    with:
      sample: 1
      artifact: all

  sample-2:
    needs: sample-1
    uses: ./.github/workflows/android-build-comparison-sample.yml
    with:
      sample: 2
      artifact: store

  sample-3:
    needs: sample-2
    uses: ./.github/workflows/android-build-comparison-sample.yml
    with:
      sample: 3
      artifact: all

  sample-4:
    needs: sample-3
    uses: ./.github/workflows/android-build-comparison-sample.yml
    with:
      sample: 4
      artifact: store

  sample-5:
    needs: sample-4
    uses: ./.github/workflows/android-build-comparison-sample.yml
    with:
      sample: 5
      artifact: all

  sample-6:
    needs: sample-5
    uses: ./.github/workflows/android-build-comparison-sample.yml
    with:
      sample: 6
      artifact: store

  sample-7:
    needs: sample-6
    uses: ./.github/workflows/android-build-comparison-sample.yml
    with:
      sample: 7
      artifact: all

  sample-8:
    needs: sample-7
    uses: ./.github/workflows/android-build-comparison-sample.yml
    with:
      sample: 8
      artifact: store

  sample-9:
    needs: sample-8
    uses: ./.github/workflows/android-build-comparison-sample.yml
    with:
      sample: 9
      artifact: all

  sample-10:
    needs: sample-9
    uses: ./.github/workflows/android-build-comparison-sample.yml
    with:
      sample: 10
      artifact: store
